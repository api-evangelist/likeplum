aid: likeplum
name: Likeplum
description: >-
  Likeplum (likeplum.com) was an online expert-knowledge and task marketplace
  that billed itself as "expert knowledge and skills at your fingertips" and
  invited users to "ask experts to answer your questions and hire skilled
  engineers, programmers, designers, writers, marketers and more on the world's
  largest information trading marketplace." Members posted either a free-to-ask
  question or a paid task, received answers and completed work from the site's
  expert pool, and paid only after approving the result under a post-pay model,
  with optional fully private posts and card or PayPal settlement. Its busiest
  categories were writing, programming, graphic design, and marketing and SEO.
  By late 2014 the company had folded the brand into the "Createpool" network,
  splitting its four most popular categories into dedicated sites — hackerpool.com
  for programming tasks, studypool.com for academic and homework Q&A,
  mechanicpool.com for auto repair, and counselpool.com for legal questions — and
  migrated every likeplum account, question, answer, and profile across. Only the
  academic property survives today: likeplum.com now 301-redirects to
  www.studypool.com, while createpool.com fails TLS negotiation and hackerpool.com,
  mechanicpool.com, and counselpool.com no longer resolve. The Likeplum brand
  exposes no developer portal, documentation, SDK, package, or public API, so this
  profile is retained in the API Evangelist network as an identity record for a
  rebranded 500 Global portfolio company rather than as an API provider.
